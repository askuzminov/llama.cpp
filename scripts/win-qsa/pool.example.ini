; the pool of servers (llama-server --pool, pool.bat): copy to pool.ini next to pool.bat and set the addresses.
; every node runs serve.bat (llama-server in router mode on port 12345) with the same model; the other flags may
; differ (-np, the experts of the 3090 in RAM). the agents use http://<this machine>:12346/v1. POOL.md explains it all

[pool]
name = home
; the name the agents see in /v1/models (OPENAI_MODEL), any text: the pool answers with it and sends it to no node.
; the agents may send any name: a router node gets its own (model = in its section below), a plain llama-server
; ignores it. empty: /v1/models as a node answers it
model = qwen3.8
; how much of its own history (tokens, estimated from the characters) a conversation must have on a busy node to be
; worth keeping:
; - this many or more: it waits for that node, as long as going elsewhere would take: computing it again there (at
;   its prefill speed) or moving its state (migrate), up to wait_max seconds; a shorter one goes to a free node at once
; - its state moves to another node only from this many tokens on, a shorter one is computed there again
; - the prefill speed of a node is measured on the prompts of this many tokens and more
; a new conversation never waits for one node
move_tokens = 4096
wait_max = 300
; a conversation that goes to another node takes its cached state along when both nodes can (the fork with its
; prompt cache, the same model and KV settings) and the transfer is shorter than computing the context again; the pool
; decides that for each move. it goes from RAM or the file of a state on disk to RAM, nothing is written to disk for
; it. 0: never (to compare, or when the moves of several GB load a shared wifi)
migrate = 1
; the speed of a link (Mbit/s) with none given after its url, until the pool measures it: one chunk of a move (16 MiB)
; each way when the link starts to serve, then the moves. the wifi measured 650
link_mbps = 500
; how often a node on a fallback url tries the urls before it again, seconds
probe_s = 10
; a node of another model than the most of the others (parameters, size, type, vocabulary) takes no request, as when
; one machine has another quant; its dashboard card says mismatch. 0: it takes requests too
same_model = 1

; url: how this machine reaches the node, in the order of preference: the direct 10 Gbit cable first, the wifi after
; it. the pool uses the first that answers; the number after a url is its speed in Mbit/s, for the estimate of a move
; until the pool measures it (when the link starts to serve). this machine reaches its own node at 127.0.0.1.
; model: the model on that node: the name of its section in the models.ini there or an alias = of it. it may differ
; from node to node, the pool sets it in every request to that node; the pool checks the model itself by its
; parameters (same_model), not by the names. slots: the parallel requests of the node (its -np), read from the node
; when left out. weight: the share of the new conversations, by speed.
; api_key: when the node has --api-key (an api_key in [pool] serves all nodes);
; the key guards the requests and the moves of the conversations against other devices on the network
;
; an example of the names. models.ini on 395a and 395b holds the model in the section [qwen3.8]:
;   [qwen3.8]
;   model = C:\models\Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
; models.ini on the 3090 under a name of its own, with an alias:
;   [qwen3.8-3090]
;   model = E:\models\Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
;   alias = qwen3.8
; then [node.395a] and [node.395b] take model = qwen3.8, [node.3090] model = qwen3.8-3090 or, by the alias,
; model = qwen3.8 (as below); without the alias line only qwen3.8-3090. the agents ask the pool for qwen3.8
; ([pool] model) whichever node answers

[node.395a]
url = http://127.0.0.1:12345 20000
model = qwen3.8

[node.395b]
url = http://10.10.0.2:12345 10000, http://192.168.1.31:12345 650
model = qwen3.8

[node.3090]
url = http://192.168.1.30:12345 650
model = qwen3.8
weight = 0.7
